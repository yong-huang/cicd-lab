name: oidc-token-demo
on: push

permissions:
  id-token: write
  contents: read

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OIDC token
        env:
          REQUEST_URL: ${{ ACTIONS_ID_TOKEN_REQUEST_URL }}
          REQUEST_TOKEN: ${{ ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $REQUEST_TOKEN" \
            "${REQUEST_URL}&audience=api://AzureADTokenExchange")
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" > oidc-token.txt
          echo "token length: $(wc -c < oidc-token.txt | tr -d ' ')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oidc-token
          path: oidc-token.txt
